plugins {
	id 'net.neoforged.moddev'
}

base {
	archivesName = "${archives_base_name}-neoforge"
}

neoForge {
	version = project.neoforge_version

	runs {
		client {
			client()
		}
	}

	mods {
		hardwarescaler {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	// Bundled into the jar so players do not have to install them separately.
	// NeoForge's Jar-in-Jar requires version ranges, with a preferred version.
	jarJar(implementation("com.github.oshi:oshi-core")) {
		version {
			strictly "[${oshi_version},7.0.0)"
			prefer "${oshi_version}"
		}
	}
	jarJar(implementation("net.java.dev.jna:jna")) {
		version {
			strictly "[${jna_version},6.0.0)"
			prefer "${jna_version}"
		}
	}
	jarJar(implementation("net.java.dev.jna:jna-platform")) {
		version {
			strictly "[${jna_version},6.0.0)"
			prefer "${jna_version}"
		}
	}
}

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'java'
}

version = "${mod_version}+${minecraft_version}"
group = maven_group

repositories {
	// fabric-api and fabric-loader are not published to Maven Central.
	maven { url = uri("https://maven.fabricmc.net/") }
	// Simple Voice Chat's API, which the jukebox streams uploaded audio through.
	maven { url = uri("https://maven.maxhenkel.de/repository/public") }
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"

	// The source uses Mojang names (Minecraft, CommandSourceStack, Blocks), so Loom
	// needs the official mappings rather than Yarn.
	mappings loom.officialMojangMappings()

	// Fabric artifacts go through modImplementation so Loom remaps them.
	modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

	// compileOnly: Simple Voice Chat provides this at runtime, so it must not be bundled.
	compileOnly "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"

	include implementation("com.github.oshi:oshi-core:6.9.0")
	include implementation("net.java.dev.jna:jna:5.17.0")
	include implementation("net.java.dev.jna:jna-platform:5.17.0")
}

def javaTarget = Integer.parseInt(java_version)

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaTarget
}

java {
	sourceCompatibility = JavaVersion.toVersion(javaTarget)
	targetCompatibility = JavaVersion.toVersion(javaTarget)
}

processResources {
	inputs.property "version", project.version
	inputs.property "java_version", java_version

	filesMatching("fabric.mod.json") {
		expand "version": project.version, "java_version": java_version
	}
}

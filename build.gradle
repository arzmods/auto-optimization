plugins {
	id 'net.fabricmc.fabric-loom' version '1.17.12'
	id 'java'
}

version = "1.0.0"
group = "com.example"

repositories {
	// fabric-api and fabric-loader are not published to Maven Central.
	maven { url = uri("https://maven.fabricmc.net/") }
	// Simple Voice Chat's API, which the jukebox streams uploaded audio through.
	maven { url = uri("https://maven.maxhenkel.de/repository/public") }
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:26.2"

	// The source in this repo uses Mojang names (net.minecraft.client.Minecraft,
	// options.renderDistance(), CommandSourceStack), so Loom needs the official mappings.
	mappings loom.officialMojangMappings()

	// Fabric artifacts have to go through modImplementation so Loom remaps them.
	modImplementation "net.fabricmc:fabric-loader:0.19.3"
	modImplementation "net.fabricmc.fabric-api:fabric-api:0.158.0+26.2"

	// compileOnly: Simple Voice Chat provides this at runtime, so it must not be bundled.
	compileOnly "de.maxhenkel.voicechat:voicechat-api:2.6.24"

	include implementation("com.github.oshi:oshi-core:6.9.0")
	include implementation("net.java.dev.jna:jna:5.17.0")
	include implementation("net.java.dev.jna:jna-platform:5.17.0")
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

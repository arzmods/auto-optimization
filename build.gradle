plugins {
    id 'fabric-loom' version '1.17'
    id 'java'
}
version = "1.0.0"
group = "com.example"

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:26.2"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.19.3"
}

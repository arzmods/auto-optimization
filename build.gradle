plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
	id 'java'
}

// Minecraft 26.1+ ships unobfuscated, so it needs no mappings and no remapping. Older
// versions (1.x) are still obfuscated and need Loom's remapping plugin instead.
def obfuscated = minecraft_version.startsWith("1.")

apply plugin: obfuscated ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'

// The remapping plugin needs Fabric artifacts on mod* configurations; without remapping
// they are plain dependencies.
def modImpl = obfuscated ? 'modImplementation' : 'implementation'

// The handful of vanilla calls that differ between 1.x and 26.x live in one small class,
// with one copy per side; only the matching copy is compiled.
sourceSets.main.java.srcDir("src/compat/${obfuscated ? 'legacy' : 'modern'}/java")

version = "${mod_version}+${minecraft_version}"
group = maven_group

repositories {
	// fabric-api and fabric-loader are not published to Maven Central.
	maven { url = uri("https://maven.fabricmc.net/") }
	// Simple Voice Chat's API, which the soundboard plays songs through.
	maven { url = uri("https://maven.maxhenkel.de/repository/public") }
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"

	// The source uses Mojang names (Minecraft, KeyMapping, Screen), so on
	// obfuscated versions Loom needs the official mappings rather than Yarn.
	if (obfuscated) {
		mappings loom.officialMojangMappings()
	}

	add(modImpl, "net.fabricmc:fabric-loader:${fabric_loader_version}")
	add(modImpl, "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}")

	// compileOnly: Simple Voice Chat provides this at runtime, so it must not be bundled.
	compileOnly "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"
}

def javaTarget = Integer.parseInt(java_version)

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaTarget
}

java {
	sourceCompatibility = JavaVersion.toVersion(javaTarget)
	targetCompatibility = JavaVersion.toVersion(javaTarget)
}

processResources {
	inputs.property "version", project.version
	inputs.property "java_version", java_version

	filesMatching("fabric.mod.json") {
		expand "version": project.version, "java_version": java_version
	}
}

// The tests are plain main() programs (so tools/run_tests.sh can run them without
// Gradle), not JUnit. Run each one as part of `gradle test` / `gradle build`.
def standaloneTests = [
	"com.example.soundboard.audio.PcmTest",
	"com.example.soundboard.audio.AudioDecoderTest",
]

tasks.named("test") {
	failOnNoDiscoveredTests = false
}

standaloneTests.each { testClass ->
	def run = tasks.register("run" + testClass.tokenize(".").last(), JavaExec) {
		group = "verification"
		classpath = sourceSets.test.runtimeClasspath
		mainClass = testClass
	}
	tasks.named("test") { dependsOn run }
}

plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'java'
}
version = "1.0.0"
group = "com.example"
repositories {
    maven { url = "https://fabricmc.net" }
}
dependencies {
    minecraft "com.mojang:minecraft:26.2"
    mappings "net.fabricmc:yarn:26.2+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:0.16.5"
}

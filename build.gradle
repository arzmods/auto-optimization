plugins {
	id 'net.fabricmc.fabric-loom' version '1.17.12'
	id 'java'
}

version = "1.0.0"
group = "com.example"

repositories {
	mavenCentral()
}

dependencies {
    implementation "net.fabricmc.fabric-api:fabric-api:0.158.0+26.2"
	minecraft "com.mojang:minecraft:26.2"
	implementation "net.fabricmc:fabric-loader:0.19.3"

	   include implementation("com.github.oshi:oshi-core:6.9.0")
   include implementation("net.java.dev.jna:jna:5.17.0")
   include implementation("net.java.dev.jna:jna-platform:5.17.0")
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

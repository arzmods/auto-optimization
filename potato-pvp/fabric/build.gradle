plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

// The mod itself lives in ../common so that the Fabric and the NeoForge build
// compile the exact same source. Only the entrypoint under src/ differs.
sourceSets {
    main {
        java.srcDir file('../common/src/main/java')
        resources.srcDir file('../common/src/main/resources')
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // Minecraft 26.x ships deobfuscated. Its version manifest offers only
    // "client" and "server" downloads - there is no client_mappings file any
    // more - and Fabric publishes no yarn for 26.3. The only mappings that
    // exist are intermediary 0.0.0, the placeholder used when the game needs
    // no renaming, so loom.officialMojangMappings() cannot work here.
    if (project.findProperty('mappingsMode') == 'layered') {
        mappings loom.layered {}
    } else {
        mappings "net.fabricmc:intermediary:${project.intermediary_version}:v2"
    }

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    // No sources jar. Loom remaps one into the "named" namespace, and with
    // intermediary-only mappings that namespace does not exist, so the task
    // fails. The mod jar itself remaps fine, and a sources jar would be
    // meaningless for a game that ships with its real names anyway.
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 25
}

jar {
    from('../LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// --------------------------------------------------------------------------
// API discovery helper, same idea as the one in the NeoForge build: read the
// real class names out of the jars on the compile classpath rather than
// guessing. Unlike that one this does not filter by package, because the
// interesting question here is usually what Fabric API calls something.
//
// gradle apiClasses -PclassContains=keybinding
// --------------------------------------------------------------------------
def apiClasspath = sourceSets.main.compileClasspath

tasks.register('apiClasses') {
    dependsOn apiClasspath
    def needles = (project.findProperty('classContains') ?: 'keybinding').toString().toLowerCase().split(',')
    doLast {
        def found = new TreeSet<String>()
        apiClasspath.files.findAll { it.name.endsWith('.jar') }.each { jar ->
            try {
                new java.util.zip.ZipFile(jar).withCloseable { zip ->
                    zip.entries().each { entry ->
                        if (!entry.name.endsWith('.class')) return
                        def binary = entry.name[0..-7].replace('/', '.')
                        def simple = binary.substring(binary.lastIndexOf('.') + 1).toLowerCase()
                        if (needles.any { simple.contains(it) }) {
                            found << binary
                        }
                    }
                }
            } catch (Exception ignored) {
            }
        }
        found.each { println "API| CLASS ${it}" }
        println "API| MATCHES ${found.size()}"
    }
}

plugins {
    id 'net.neoforged.moddev' version "${moddev_version}"
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

// Same shared source tree the Fabric build uses.
sourceSets {
    main {
        java.srcDir file('../common/src/main/java')
        resources.srcDir file('../common/src/main/resources')
    }
}

neoForge {
    version = project.neoforge_version

    mods {
        potatopvp {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.version
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 25
}

// --------------------------------------------------------------------------
// API discovery helpers.
//
// Minecraft renames classes and methods between versions, and this project is
// developed in an environment that cannot download Minecraft. These tasks read
// the real names straight out of the jars on the compile classpath.
//
// The dependsOn matters: ModDevGradle produces the Minecraft jar as a task
// output, so without it these tasks run against a classpath that does not yet
// contain Minecraft and cheerfully report that nothing exists.
// --------------------------------------------------------------------------

def apiClasspath = sourceSets.main.compileClasspath

// Sanity check - if this prints no Minecraft jar, the other two are lying.
tasks.register('apiJars') {
    dependsOn apiClasspath
    doLast {
        def jars = apiClasspath.files.findAll { it.name.endsWith('.jar') }
        println "JAR COUNT ${jars.size()}"
        jars.each { println "JAR ${it.name}" }
    }
}

// gradle apiClasses -PclassContains=Location,Graphics
tasks.register('apiClasses') {
    dependsOn apiClasspath
    def needles = (project.findProperty('classContains') ?: 'ResourceLocation').toString().toLowerCase().split(',')
    doLast {
        def found = new TreeSet<String>()
        apiClasspath.files.findAll { it.name.endsWith('.jar') }.each { jar ->
            try {
                new java.util.zip.ZipFile(jar).withCloseable { zip ->
                    zip.entries().each { entry ->
                        if (!entry.name.endsWith('.class')) return
                        def binary = entry.name[0..-7].replace('/', '.')
                        if (!binary.startsWith('net.minecraft') && !binary.startsWith('com.mojang')) return
                        def simple = binary.substring(binary.lastIndexOf('.') + 1).toLowerCase()
                        if (needles.any { simple.contains(it) }) {
                            found << binary
                        }
                    }
                }
            } catch (Exception ignored) {
            }
        }
        found.each { println "CLASS ${it}" }
        println "MATCHES ${found.size()}"
    }
}

// gradle apiMethods -PtypeNames=net.minecraft.client.Minecraft
tasks.register('apiMethods') {
    dependsOn apiClasspath
    def wanted = (project.findProperty('typeNames') ?: 'net.minecraft.client.Options').toString().split(',')
    doLast {
        def urls = apiClasspath.files.collect { it.toURI().toURL() } as URL[]
        def loader = new URLClassLoader(urls, ClassLoader.getPlatformClassLoader())
        wanted.each { name ->
            println "==== ${name}"
            try {
                def type = Class.forName(name, false, loader)
                type.constructors.each { c ->
                    println "  CTOR (${c.parameterTypes.collect { it.simpleName }.join(', ')})"
                }
                type.fields.toList().sort { it.name }.each { f ->
                    println "  FIELD ${f.type.simpleName} ${f.name}"
                }
                type.methods.toList().sort { it.name }.each { m ->
                    def args = m.parameterTypes.collect { it.simpleName }.join(', ')
                    println "  ${m.returnType.simpleName} ${m.name}(${args})"
                }
            } catch (Throwable t) {
                println "  MISSING ${t.class.simpleName} ${t.message}"
            }
        }
    }
}

name: Potato PvP

# Only runs when the Potato PvP folder changes, so it stays out of the way of
# the Auto Optimization build at the repo root.
on:
  push:
    paths:
      - 'potato-pvp/**'
      - '.github/workflows/potato-pvp.yml'
  pull_request:
    paths:
      - 'potato-pvp/**'
  workflow_dispatch:

env:
  MINECRAFT_VERSION: "26.3"
  # fabric-loom 1.18.x requires a Gradle with plugin api-version >= 9.7.0
  GRADLE_VERSION: "current"

jobs:
  # Runs first and never fails. The build machine can reach the Fabric and
  # NeoForge mavens, so this prints the version numbers that actually exist for
  # this Minecraft version - handy when a build breaks after a Minecraft update.
  discover-versions:
    name: Which versions exist
    runs-on: ubuntu-latest
    steps:
      - name: Minecraft versions known to Fabric
        run: |
          curl -sS https://meta.fabricmc.net/v2/versions/game \
            | jq -r '.[0:15][] | "\(.version)  stable=\(.stable)"' || true

      - name: Fabric loader
        run: |
          curl -sS https://meta.fabricmc.net/v2/versions/loader \
            | jq -r '.[0:5][] | "\(.version)  stable=\(.stable)"' || true

      - name: Fabric API builds for Minecraft ${{ env.MINECRAFT_VERSION }}
        run: |
          curl -sS "https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%22${MINECRAFT_VERSION}%22%5D" \
            | jq -r '.[0:10][] | .version_number' || true

      - name: fabric-loom
        run: |
          curl -sS https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml \
            | grep -o '<version>[^<]*' | tail -15 || true

      - name: NeoForge builds
        run: |
          curl -sS https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml \
            | grep -o '<version>[^<]*' | tail -20 || true

      - name: ModDevGradle
        run: |
          curl -sS https://maven.neoforged.net/releases/net/neoforged/moddev-gradle/maven-metadata.xml \
            | grep -o '<version>[^<]*' | tail -15 || true

  # Minecraft renames classes and methods between versions. This reads the real
  # names out of the jar on the compile classpath, so the mod can be corrected
  # against fact rather than guesswork.
      - name: Does Mojang still ship deobfuscation mappings for this version
        run: |
          URL=$(curl -sS https://launchermeta.mojang.com/mc/game/version_manifest_v2.json \
            | jq -r --arg v "$MINECRAFT_VERSION" '.versions[] | select(.id==$v) | .url')
          echo "version json: $URL"
          curl -sS "$URL" | jq '.downloads | keys' || true

      - name: Yarn and intermediary for this version
        run: |
          echo "-- yarn --"
          curl -sS "https://meta.fabricmc.net/v2/versions/yarn/${MINECRAFT_VERSION}" \
            | jq -r '.[0:5][] | .version' || true
          echo "-- intermediary --"
          curl -sS "https://meta.fabricmc.net/v2/versions/intermediary/${MINECRAFT_VERSION}" \
            | jq -r '.[] | .maven' || true

  discover-api:
    name: Minecraft API names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Last unknown - how a standalone texture is loaded
        working-directory: potato-pvp/neoforge
        run: |
          gradle -q apiJars --no-daemon > /dev/null 2>&1 || true

          echo "=== texture contents classes ==="
          gradle -q apiClasses --no-daemon \
            -PclassContains=texturecontents 2>/dev/null | grep '^API|' || true

          echo "=== SimpleTexture, every method and field ==="
          gradle -q apiMethods --no-daemon -PshowFields \
            -PtypeNames=net.minecraft.client.renderer.texture.SimpleTexture 2>/dev/null \
            | grep '^API|' || true

          echo "=== TextureContents ==="
          gradle -q apiMethods --no-daemon -PshowFields \
            -PtypeNames=net.minecraft.client.renderer.texture.TextureContents 2>/dev/null \
            | grep '^API|' || true

          echo "=== NativeImage pixel accessors (confirm) ==="
          gradle -q apiMethods --no-daemon \
            -PtypeNames=com.mojang.blaze3d.platform.NativeImage 2>/dev/null | grep '^API|' \
            | grep -iE '====|MISSING|pixel|color|rgba|abgr' || true

  # Actually launches Minecraft with the mod in it, headless, and reads back
  # what the mod says it did. This cannot see the screen, but it proves whether
  # the game boots, whether the mixins attach, and - the question that has cost
  # the most time - whether the texture reduction actually runs and on how many
  # sprites. Never fails the build; it is here to report, not to gate.
  smoke-test:
    name: Launch the game for real
    runs-on: ubuntu-latest
    needs: neoforge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Software OpenGL and a virtual screen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 \
            libegl-mesa0 libegl1 libgl1 libglu1-mesa mesa-vulkan-drivers \
            libsdl2-2.0-0 libopenal1 x11-xserver-utils > /dev/null
          echo "installed"

      # NeoForge rather than Fabric. Loom's dev runtime remaps into a "named"
      # namespace, and on 26.3 - which ships deobfuscated and forces
      # intermediary mappings - that collides with Fabric API's access
      # wideners before the game ever starts. NeoForge's dev client runs in the
      # same namespace as the real game, so it does not have that problem. The
      # mod is the same code either way.
      - name: Run the client until it settles, then stop it
        working-directory: potato-pvp/neoforge
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: '4.6'
          MESA_GLSL_VERSION_OVERRIDE: '460'
          SDL_VIDEODRIVER: x11
          SDL_RENDER_DRIVER: opengl
        run: |
          # Loom's runClient never exits on its own, so give it a window and
          # then take it away. A timeout kill is the expected outcome here.
          timeout --signal=KILL 600 \
            xvfb-run -a --server-args="-screen 0 1280x720x24 +extension GLX +extension RANDR +render -noreset" \
            gradle runClient --no-daemon || true
          echo "client stopped"

      - name: What the mod reported
        working-directory: potato-pvp/neoforge
        run: |
          LOG=$(find . -name latest.log -path "*run*" 2>/dev/null | head -1)
          if [ -z "$LOG" ] || [ ! -f "$LOG" ]; then
            echo "no log written - the client did not get far enough to make one"
            ls -R run 2>/dev/null | head -40 || echo "no run directory at all"
            exit 0
          fi

          echo "===== did a rendering backend come up ====="
          grep -iE "backend|llvmpipe|Using graphics device|OpenGL" "$LOG" | head -12 || echo "(nothing)"

          echo
          echo "===== every line the mod logged ====="
          grep -i "potato" "$LOG" || echo "(the mod logged nothing at all)"

          echo
          echo "===== mixin problems, if any ====="
          grep -iE "mixin.*(error|fail|could not|invalid)" "$LOG" | head -20 \
            || echo "(none)"

          echo
          echo "===== crashes / severe ====="
          grep -iE "^.*(FATAL|/ERROR\]|Caused by)" "$LOG" | head -30 || echo "(none)"

          echo
          echo "===== how far it got ====="
          grep -iE "Sound engine started|Created: .*atlas|Stopping|OpenAL initialized" "$LOG" \
            | tail -10 || echo "(did not reach sound engine)"

      - name: Keep the log either way
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-log
          path: |
            potato-pvp/neoforge/run/logs/
            potato-pvp/neoforge/runs/
          if-no-files-found: ignore

  fabric:
    name: Build Fabric
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: What Fabric API calls its key binding helper
        working-directory: potato-pvp/fabric
        run: |
          gradle -q apiClasses --no-daemon \
            -PclassContains=keybindinghelper,keymappinghelper,keybindingregistry 2>/dev/null \
            | grep '^API|' || true

      - name: Build
        working-directory: potato-pvp/fabric
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: potato-pvp-fabric
          # Exactly one jar, so there is nothing to choose between.
          path: |
            potato-pvp/fabric/build/libs/*.jar
            !potato-pvp/fabric/build/libs/*-sources.jar
            !potato-pvp/fabric/build/libs/*-dev.jar
            !potato-pvp/fabric/build/libs/*-dev-shadow.jar

  neoforge:
    name: Build NeoForge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build
        working-directory: potato-pvp/neoforge
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: potato-pvp-neoforge
          # Exactly one jar, so there is nothing to choose between.
          path: |
            potato-pvp/neoforge/build/libs/*.jar
            !potato-pvp/neoforge/build/libs/*-sources.jar
